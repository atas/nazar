name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's PRs. GitHub squash-merges one only once every required
# check (go and the Claude review) has passed; a failing check leaves it open.
on:
    pull_request:

permissions:
    contents: write
    pull-requests: write

jobs:
    automerge:
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - run: gh pr merge --auto --squash "$PR"
              env:
                  PR: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
