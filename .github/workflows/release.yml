# Releases nazar: weekly when main has new commits, or by hand (Actions →
# Release → Run workflow). It builds, signs (Developer ID), notarizes,
# publishes the GitHub release and updates atas/homebrew-tap. The signing
# secrets live in the `release` environment only. docs/RELEASING.md.
#
# Linux is a separate job with no secret and no environment. The macOS job runs
# after it, whatever it did, and publishes its files only when it built.
name: Release

on:
    schedule:
        - cron: "0 12 * * 6"
    workflow_dispatch:
        inputs:
            version:
                description: "Version (X.Y.Z); empty: the next patch"
                required: false

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # Which version, if any: nothing when main has no commit since the last tag.
    plan:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            version: ${{ steps.v.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - id: v
              env:
                  WANT: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
                  if [ -n "$last" ] && [ -z "$(git rev-list "$last..HEAD")" ]; then
                      echo "no commits since $last: nothing to release"
                      exit 0
                  fi
                  if [ -n "$WANT" ]; then
                      v=$WANT
                  else
                      IFS=. read -r a b c <<<"${last#v}"
                      v="$a.$b.$((c + 1))"
                  fi
                  [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $v" >&2; exit 1; }
                  ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null || { echo "v$v exists" >&2; exit 1; }
                  echo "releasing $v (after ${last:-nothing})"
                  echo "version=$v" >> "$GITHUB_OUTPUT"

    # After linux, whatever linux did: a failed Linux job does not stop macOS.
    # !cancelled() and not always(), so cancelling the run still stops a release.
    # The hour the macOS steps always had, and 15 minutes for the Linux steps.
    release:
        needs: [plan, linux]
        if: ${{ !cancelled() && needs.plan.outputs.version != '' }}
        runs-on: ${{ vars.RELEASE_RUNNER || 'macos-26' }}
        environment: release
        timeout-minutes: 75
        env:
            V: ${{ needs.plan.outputs.version }}
            NAZAR_SIGN_ID: ${{ vars.NAZAR_SIGN_ID }}
            NAZAR_NOTARY_PROFILE: nazar-notary
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            # The version goes into both bundles on a release commit that only
            # the tag points to; main is not changed.
            - name: Version and tag
              run: |
                  set -euo pipefail
                  build=$(git rev-list --count HEAD)
                  for p in macos/Resources/Agent/Info.plist macos/Resources/UI/Info.plist; do
                      /usr/bin/plutil -replace CFBundleShortVersionString -string "$V" "$p"
                      /usr/bin/plutil -replace CFBundleVersion -string "$build" "$p"
                  done
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -qam "nazar $V"
                  git tag -a "v$V" -m "v$V"

            # A throwaway keychain on the throwaway runner: the Developer ID
            # identity and the notary profile, nothing else.
            - name: Keychain
              env:
                  P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
                  P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
                  NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
                  NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
                  NOTARY_ISSUER: ${{ vars.NOTARY_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  kc="$RUNNER_TEMP/release.keychain-db"
                  kcpw=$(openssl rand -hex 24)
                  security create-keychain -p "$kcpw" "$kc"
                  security set-keychain-settings -lut 3600 "$kc"
                  security unlock-keychain -p "$kcpw" "$kc"
                  printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
                  security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
                  rm -f "$RUNNER_TEMP/id.p12"
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
                  security list-keychains -d user -s "$kc"
                  security default-keychain -d user -s "$kc"
                  printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
                  xcrun notarytool store-credentials "$NAZAR_NOTARY_PROFILE" --key "$RUNNER_TEMP/notary.p8" \
                      --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$kc"
                  rm -f "$RUNNER_TEMP/notary.p8"
                  security find-identity -v -p codesigning "$kc"

            - name: Build, sign, notarize
              run: make release

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  git push origin "v$V"
                  gh release create "v$V" --verify-tag --title "v$V" --generate-notes \
                      "build/release/nazar-$V.zip" "build/release/nazar-ui-$V.zip"
                  for z in "nazar-$V.zip" "nazar-ui-$V.zip"; do
                      got=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/$z" | shasum -a 256 | cut -d' ' -f1)
                      want=$(shasum -a 256 "build/release/$z" | cut -d' ' -f1)
                      [ "$got" = "$want" ] || { echo "$z: downloaded $got, built $want" >&2; exit 1; }
                  done

            # The Linux steps may fail without failing the job until the tap is
            # pushed: the casks go whatever happens here. Nothing in the artifact
            # runs in this job; it is uploaded, summed and read for its sums.
            - name: Download the Linux files
              id: get-linux
              if: needs.linux.result == 'success'
              continue-on-error: true
              timeout-minutes: 5
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: linux
                  path: build/release-linux

            - name: Publish Linux
              id: publish-linux
              if: needs.linux.result == 'success' && steps.get-linux.outcome == 'success'
              continue-on-error: true
              timeout-minutes: 10
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  dir=build/release-linux
                  amd="nazar-$V-linux-amd64.tar.gz"
                  arm="nazar-$V-linux-arm64.tar.gz"
                  gh release upload "v$V" --repo "$GITHUB_REPOSITORY" \
                      "$dir/$amd" "$dir/$arm" "$dir/SHA256SUMS" "$dir/install.sh"
                  for f in "$amd" "$arm" install.sh; do
                      got=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/$f" | shasum -a 256 | cut -d' ' -f1)
                      want=$(awk -v f="$f" '$2 == f { print $1 }' "$dir/SHA256SUMS")
                      [ -n "$want" ] && [ "$got" = "$want" ] || { echo "$f: downloaded $got, SHA256SUMS says $want" >&2; exit 1; }
                  done
                  gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
                  printf '\n%s\n' "Linux (preview, not yet verified on real hardware): nazar-$V-linux-amd64.tar.gz, nazar-$V-linux-arm64.tar.gz, SHA256SUMS, install.sh" >> "$RUNNER_TEMP/notes.md"
                  gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
                  scripts/release-linux.sh formula "$V" "$dir/SHA256SUMS" build/tap-out

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: atas/homebrew-tap
                  path: tap
                  ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

            # The formula is there only when the Linux files were published.
            # It goes to the tap's root, next to the tap's other formulae:
            # Homebrew reads formulae from Formula/ alone once that folder
            # exists, so making one would hide the others from every Mac.
            - name: Update the tap
              run: |
                  set -euo pipefail
                  mkdir -p tap/Casks
                  make release-tap TAP=tap
                  if [ -f build/tap-out/nazar-linux.rb ]; then
                      cp build/tap-out/nazar-linux.rb tap/
                  fi
                  cd tap
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add Casks
                  if [ -f nazar-linux.rb ]; then git add nazar-linux.rb; fi
                  git commit -m "nazar $V"
                  git push

            - name: Say that Linux was not published
              if: needs.linux.result == 'success' && steps.publish-linux.outcome != 'success'
              run: |
                  echo "::error::the casks are pushed, but the Linux files were not published: see the Publish Linux step and docs/RELEASING.md"
                  exit 1

            - name: Remove the keychain
              if: always()
              run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

    # The Linux tarballs. No secret and no environment: this job runs the tests
    # and only hands its files on. Every step has its own timeout and the job has
    # none: a step that times out fails, and macOS runs after a failure. What a
    # job-level timeout does to the jobs that need this one is not documented.
    linux:
        needs: plan
        if: needs.plan.outputs.version != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            V: ${{ needs.plan.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              timeout-minutes: 5
              with:
                  persist-credentials: false

            # No restored build cache in a release build.
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              timeout-minutes: 5
              with:
                  go-version-file: go.mod
                  cache: false

            - run: make test
              timeout-minutes: 30

            - name: Build the tarballs
              timeout-minutes: 10
              run: scripts/release-linux.sh tarballs "$V" build/release-linux

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              timeout-minutes: 5
              with:
                  name: linux
                  path: build/release-linux
                  if-no-files-found: error
