name: Claude PR Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

concurrency:
    group: claude-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read
            pull-requests: write
            issues: read
            id-token: write
        steps:
            - id: override
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  labels=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name')
                  if grep -qx claude-override <<<"$labels"; then
                      echo "claude-override label set: skipping the review."
                      echo "set=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: steps.override.outputs.set != 'true'
              with:
                  fetch-depth: 0

            - id: cc
              if: steps.override.outputs.set != 'true'
              # Use a Claude Code already on the runner, if any, instead of downloading it on every
              # run; otherwise this is empty and the action installs it.
              run: echo "path=$(command -v claude || true)" >> "$GITHUB_OUTPUT"

            - id: claude
              if: steps.override.outputs.set != 'true'
              uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
              with:
                  path_to_claude_code_executable: ${{ steps.cc.outputs.path }}
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  track_progress: true
                  # Dependabot PRs get the same review; the action refuses bot-started runs otherwise.
                  allowed_bots: "dependabot[bot]"
                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ github.event.pull_request.number }}

                      nazar is a SECURITY tool: a macOS Secure Enclave SSH agent and secrets broker.
                      Review this pull request against the spec docs/design/nazar-design.md
                      (its threat model in section 8 and the decisions recorded in it are authoritative), the module
                      designs next to it and docs/THREAT-MODEL.md. Focus on:
                      - security: any path from an unlisted or faked caller to a signature or secret; rule, gate
                        or scope bypass; caller spoofing (pid reuse, name/path tricks, chain truncation); a wrong
                        receiver; fail-open error paths; races in the approval cache or prompt throttling;
                        unapproved config loosening; parsing of untrusted bytes (SSH wire format, YAML, JSON,
                        known_hosts); secrets, argv or attacker text reaching logs, prompts or the terminal;
                      - correctness bugs and error handling;
                      - tests that do not actually pin the behaviour they claim (would a broken implementation
                        still pass?);
                      - drift from the spec or the platform interface contract.
                      Skip formatting and style nits that gofmt or go vet would catch.

                      Score every candidate issue 0-100 for confidence that it is a real problem
                      a careful maintainer would fix: 0 is a false positive or a pre-existing
                      issue, 50 is real but minor or unlikely in practice, 100 is certain and
                      will happen. Verify against the code before scoring.

                      - Below 60: drop it. Do not comment on it or mention it.
                      - 60-79: an inline comment starting "[70/100] Optional:"; fixing it is the
                        author's call and it never blocks.
                      - 80 and above: an inline comment starting "[85/100] Blocking:" and an
                        entry in blocking_issues.

                      Post inline comments with mcp__github_inline_comment__create_inline_comment.
                      Earlier runs may have reviewed this PR already: read their inline comments
                      with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
                      and do not repeat a comment that is still on the same unchanged code, but
                      keep listing a still-unfixed 80+ issue in blocking_issues. An earlier
                      blocking issue that is now fixed is simply left out.

                      Then post one short summary with `gh pr comment`: the blocking count, the
                      optional count, and "looks good" when both are zero.

                      Return blocking_issues: one line per 80+ issue, "path:line — what breaks",
                      or an empty list.
                  claude_args: |
                      --model claude-opus-5-5
                      --max-turns 150
                      --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Read,Grep,Glob"
                      --json-schema '{"type":"object","properties":{"blocking_issues":{"type":"array","items":{"type":"string"}}},"required":["blocking_issues"]}'

            - name: Request or lift changes
              if: steps.override.outputs.set == 'true' || steps.claude.outcome == 'success'
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERDICT: ${{ steps.claude.outputs.structured_output }}
                  OVERRIDE: ${{ steps.override.outputs.set }}
                  PR: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  pending=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                      --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED") | .id')
                  dismiss() {
                      for id in $pending; do
                          gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
                              -f message="$1" -f event=DISMISS >/dev/null
                      done
                  }

                  if [ "$OVERRIDE" = "true" ]; then
                      dismiss "Overridden with the claude-override label."
                      exit 0
                  fi
                  # No verdict means nothing was reviewed (the action skipped itself, for
                  # example on a PR that changes this file, or the model stopped early):
                  # fail closed. The claude-override label, set by a person, is the way past.
                  [ -z "$VERDICT" ] && { echo "::error::No review verdict: the review did not run. Fix the cause, or a person adds the claude-override label."; exit 1; }

                  if [ "$(jq '.blocking_issues | length' <<<"$VERDICT")" -eq 0 ]; then
                      dismiss "Blocking issues fixed as of ${SHA:0:7}."
                      echo "No blocking issues."
                      exit 0
                  fi

                  body=$(jq -r '"Claude found blocking issues (80+/100). Fix them, or add the `claude-override` label and re-run the review job.\n\n" + (.blocking_issues | map("- " + .) | join("\n"))' <<<"$VERDICT")
                  dismiss "Superseded by the review of ${SHA:0:7}."
                  gh pr review "$PR" --repo "$REPO" --request-changes --body "$body"
                  echo "::error::Blocking issues found; see the review on the PR."
                  exit 1
